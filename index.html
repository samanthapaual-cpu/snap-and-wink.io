<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/frames/logo1.png">
    <title>Snap and Wink</title>
</head>
<body>
    <div class="container">
        <h1>Snap and Wink</h1>

        <div id="frames" placeholder="Choose a frame"></div>

        <video id="video" autoplay playsinline muted></video>

        <div class="stage">
            <canvas id="canvas"></canvas>
            <div class="overlay"></div>
            <div class="flash"></div>
        </div>

        <p id="status" live="polite">Loading camera...</p>

        <div class="controls">
            <label>Countdown (sec) <input type="number" id="timer" min="0" value="3"></label>
            <label>Pause between poses (sec) <input type="number" id="pause" min="0" value="3"></label>

            <button id="mirror-btn">Mirror: On</button>
            <button id="filter-btn">Filter: None</button>
            <button id="capture-btn" class="main" disabled>Capture</button>
        </div>

        <div id="taken"></div>

        <div id="result-box" hidden>
            <canvas id="result"></canvas>
            <div class="controls">
                <button id="download-btn" class="main">Download</button>
                <button id="retake-btn">Retake</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
